# NOTE: When introducing a new filetype to the project, ensure we add appropriate
# linters/formatters to this configuration.

ci:
  skip:
    # pre-commit.ci doesn't have cargo installed inside its runners so these
    # jobs fail with "Executable `cargo` not found".
    # https://github.com/pre-commit-ci/issues/issues/89
    - fmt
    - clippy

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: clippy

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json]
