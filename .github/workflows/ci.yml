name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: j178/prek-action@v1
        with:
          args: run --all-files

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli --locked
      - name: Run migrations up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
        run: sea-orm-cli migrate -d migration up
      - name: Run migrations down
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
        run: sea-orm-cli migrate -d migration down
      - name: Run migrations up again
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
        run: sea-orm-cli migrate -d migration up
      - name: Generate entities
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
        run: sea-orm-cli generate entity --output-dir src/entities
      - name: Check for entity changes
        run: |
          if [ -n "$(git status --porcelain src/entities)" ]; then
            echo "Error: Generated entities are out of date. Please run 'cargo run --bin generate-entity' and commit the changes."
            git diff -- src/entities
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
        working-directory: frontend
      - name: Check formatting
        run: bunx prettier --check .
        working-directory: frontend
      - name: Run tests
        run: bun test
        working-directory: frontend
